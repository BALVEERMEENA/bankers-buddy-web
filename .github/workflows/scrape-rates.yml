name: Scrape bank FD rates

on:
  schedule:
    # Runs daily at 01:30 UTC (~07:00 IST). GitHub cron is UTC.
    - cron: "30 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install scraper deps
        working-directory: scraper
        run: npm ci || npm install

      - name: Run scraper
        working-directory: scraper
        run: npm run scrape

      - name: Commit updated rates
        run: |
          if git diff --quiet -- data/rates.json; then
            echo "No rate changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          git commit -m "chore: update bank FD rates ($(date -u +%Y-%m-%d))"
          git push
